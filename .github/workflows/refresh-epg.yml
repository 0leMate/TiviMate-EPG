name: Refresh TiviMate EPG

on:
  workflow_dispatch:
  schedule:
    # Every 12 hours. GitHub cron is UTC.
    - cron: "30 */2 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate XMLTV guide from fresh Vortex playlist
        env:
          XTREAM_M3U_URL: ${{ secrets.XTREAM_M3U_URL }}
        run: python generate_epg.py

      - name: Commit updated guide
        env:
          XTREAM_M3U_URL: ${{ secrets.XTREAM_M3U_URL }}
        run: |
          git config user.name "EPG updater"
          git config user.email "actions@users.noreply.github.com"

          git fetch origin main
          git reset --hard origin/main

          python generate_epg.py

          git add vortex_custom_event_epg.xml

          if git diff --cached --quiet; then
            echo "No EPG changes to commit."
          else
            git commit -m "Refresh EPG from Vortex playlist"
            git push origin HEAD:main
          fi
