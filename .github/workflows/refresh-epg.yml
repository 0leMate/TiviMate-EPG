name: Refresh TiviMate EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */8 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate XMLTV guide
        env:
          XTREAM_M3U_URL: ${{ secrets.XTREAM_M3U_URL }}
          ZULIP_SITE: ${{ secrets.ZULIP_SITE }}
          ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
          ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
        run: python generate_epg.py

      - name: Commit updated guide
        run: |
          git config user.name "EPG updater"
          git config user.email "actions@users.noreply.github.com"
          git add vortex_custom_event_epg.xml

          if git diff --cached --quiet; then
            echo "No EPG changes to commit."
          else
            git commit -m "Refresh EPG"
            git push
          fi
